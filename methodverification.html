<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React App Demo</title>
    
    <!-- React 核心库 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel 编译器 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body>
    
    <!-- 导航返回按钮 -->
    <div class="fixed top-4 left-4 z-50">
        <a href="./index.html" class="flex items-center gap-2 px-4 py-2 bg-white text-gray-700 rounded-full shadow-md hover:bg-gray-50 hover:text-blue-600 transition-all text-sm font-medium">
            ← 返回导航页
        </a>
    </div>

    <!-- React 根节点 -->
    <div id="root"></div>

    <!-- 
      重要：修改下方的 src="..." 指向你想要运行的 JSX 文件 
      例如：src="./Game.jsx" 或 src="./Todo.jsx"
    -->
    <script type="text/babel" src="./MethodVerification.jsx"></script>
    
</body>
</html>
